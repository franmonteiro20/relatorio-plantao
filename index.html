<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatório de Plantão - Equipe D (24x72)</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --accent: #0f766e;
      --ai: #6d28d9;
      --ai-hover: #5b21b6;
      --danger: #b91c1c;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --success-bg: #dcfce7;
      --success-text: #166534;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 60px; }

    header {
      background: var(--primary);
      color: #fff;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    header h1 { margin: 0; font-size: 1.15rem; }
    header small { color: #cbd5e1; display: block; font-size: 0.78rem; margin-top: 2px; }

    .sync-badge {
      display: inline-block;
      font-size: 0.74rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(255,255,255,0.15);
      color: #fff;
      margin-left: 6px;
      vertical-align: middle;
    }

    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .toggle-bar {
      background: #e2e8f0;
      padding: 8px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 600;
      color: #334155;
      border-bottom: 1px solid #cbd5e1;
    }
    .toggle-bar label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      margin: 0;
    }
    .toggle-bar input { width: auto; margin: 0; }

    .container {
      max-width: 1180px;
      margin: 18px auto;
      padding: 0 14px;
      display: grid;
      grid-template-columns: 1.05fr 1.15fr;
      gap: 18px;
    }

    @media (max-width: 880px) {
      .container { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--card);
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
    }

    h2 { margin: 0 0 12px; font-size: 1.05rem; color: var(--primary); border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
    h3 { margin: 14px 0 8px; font-size: 0.82rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 7px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 8px 11px;
      font-size: 0.84rem;
      font-weight: 600;
      transition: 0.15s;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-ai { background: var(--ai); color: #fff; }
    .btn-ai:hover { background: var(--ai-hover); }
    .btn-recording { background: #dc2626 !important; color: #fff; animation: pulse 1.2s infinite; }
    .btn-quick { background: #e0e7ff; color: #1e3a8a; text-align: left; font-size: 0.8rem; padding: 8px 9px; }
    .btn-quick:hover { background: #c7d2fe; }
    .btn-work { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; text-align: left; font-size: 0.78rem; padding: 7px 9px; }
    .btn-work:hover { background: #dcfce7; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: #f8fafc; }
    .btn-danger { background: #fee2e2; color: var(--danger); }
    .btn-danger:hover { background: #fecaca; }
    .btn-copy { background: #0f766e; color: #fff; font-size: 0.78rem; padding: 6px 10px; }
    .btn-copy:hover { background: #115e59; }
